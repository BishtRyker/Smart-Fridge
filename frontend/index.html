<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Fridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Smart Fridge</h1><p id="clock"></p></header>
  <main>
    <section class="status">
      <div class="card"><h2>Temperature</h2><p class="value">4°C</p></div>
      <div class="card"><h2>Humidity</h2><p class="value">58%</p></div>
      <div class="card"><h2>Door</h2><p class="value">Closed</p></div>
    </section>
    <section class="columns">
      <div class="card">
        <h2>Inventory</h2>
        <form id="inventoryForm">
          <input id="itemName" placeholder="Food name" required>
          <input id="itemQuantity" type="number" min="1" value="1" required>
          <button type="submit">Add item</button>
        </form>
        <ul id="inventoryList"></ul>
      </div>
      <div class="card">
        <h2>Shopping list</h2>
        <form id="shoppingForm">
          <input id="shoppingName" placeholder="Shopping item" required>
          <button type="submit">Add item</button>
        </form>
        <ul id="shoppingList"></ul>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
